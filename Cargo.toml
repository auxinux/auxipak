[workspace]
resolver = "2"
members = ["shared", "client", "builder", "server"]

[workspace.package]
version = "1.0.9"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/auxinux/auxipak"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
tempfile = "3"
tough = "0.24"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
url = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
jsonschema = { version = "0.59", default-features = false }
regex = "1"
futures = "0.3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
