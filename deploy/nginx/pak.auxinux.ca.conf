# Nginx — pak.auxinux.ca (Debian 13).
# Certificat : certbot certonly --nginx -d pak.auxinux.ca
# Installer dans /etc/nginx/sites-available/ puis lier dans sites-enabled/.

server {
    listen 80;
    listen [::]:80;
    server_name pak.auxinux.ca;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pak.auxinux.ca;

    ssl_certificate     /etc/letsencrypt/live/pak.auxinux.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pak.auxinux.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Paquets volumineux : envoi direct au serveur, sans mise en tampon.
    client_max_body_size 8g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Limitation simple des tentatives de connexion à l'administration.
    location = /api/v1/auth/login { limit_req zone=auxipak_login burst=5 nodelay; proxy_pass http://127.0.0.1:8080; include /etc/nginx/snippets/auxipak-proxy.conf; }
    location = /admin/login       { limit_req zone=auxipak_login burst=5 nodelay; proxy_pass http://127.0.0.1:8080; include /etc/nginx/snippets/auxipak-proxy.conf; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/auxipak-proxy.conf;
    }
}

# À placer dans le bloc http (ex. /etc/nginx/conf.d/auxipak-limits.conf) :
#   limit_req_zone $binary_remote_addr zone=auxipak_login:10m rate=10r/m;
